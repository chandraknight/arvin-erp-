{% extends "ecom/storefront/base.html" %}
{% load static %}

{% block page_title %}Page Not Found{% endblock %}

{% block content %}
<section class="max-w-[640px] mx-auto px-4 py-24 text-center">
 <h1 class="font-display text-8xl md:text-9xl leading-none text-transparent bg-clip-text bg-gradient-to-b from-goldlt to-saffron">404</h1>
 <h3 class="font-display text-2xl text-cream mt-6 mb-3">Page Not Found</h3>
 <p class="text-cream/60 text-sm mb-8">The page you're looking for doesn't exist or has been moved.</p>
 <div class="flex flex-wrap items-center justify-center gap-3">
 <a href="{% url 'ecom:home' %}" class="h-12 px-7 rounded-full bg-saffron text-white font-medium flex items-center gap-2 hover:brightness-110 shadow-glow transition">Go Home</a>
 <a href="{% url 'ecom:product_list' %}" class="h-12 px-7 rounded-full glass text-cream/85 font-medium flex items-center hover:border-gold transition">Browse Products</a>
 </div>
</section>
{% endblock %}
