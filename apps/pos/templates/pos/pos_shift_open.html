{% extends 'base.html' %}
{% load static %}

{% block title %}Open Shift{% endblock %}

{% block content %}
<div class="w-full mt-2 max-w-lg mx-auto">

 <h2 class="text-2xl font-bold text-gray-800 flex items-center gap-2 mb-6">
 <i class="fas fa-cash-register text-green-600"></i> Open Till Shift
 </h2>

 {% if active_shift %}
 <div class="bg-white border border-gray-200 shadow-sm p-6 text-center">
 <p class="text-gray-700">A shift is already open, opened at {{ active_shift.opened_at|date:"Y-m-d H:i" }}.</p>
 <a href="{% url 'pos:terminal' %}"
 class="inline-flex items-center gap-2 mt-4 bg-green-600 hover:bg-green-700 text-white text-sm font-medium px-4 py-2 transition duration-150">
 Go to Terminal
 </a>
 </div>
 {% else %}
 <form method="post" class="bg-white border border-gray-200 shadow-sm p-6 space-y-4">
 {% csrf_token %}
 <div class="flex flex-col gap-1">
 <label class="text-sm font-medium text-gray-700">Opening Float (NPR)</label>
 <input type="number" step="0.01" name="opening_float" value="0.00" required
 class="border border-gray-300 px-3 py-2 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-green-600 transition duration-150">
 </div>
 <div class="flex flex-col gap-1">
 <label class="text-sm font-medium text-gray-700">Terminal Name (optional)</label>
 <input type="text" name="terminal_name" placeholder="e.g. Counter 1"
 class="border border-gray-300 px-3 py-2 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-green-600 transition duration-150">
 </div>
 <button type="submit"
 class="w-full bg-green-600 hover:bg-green-700 text-white text-sm font-medium px-4 py-2 transition duration-150">
 Open Shift
 </button>
 </form>
 {% endif %}

</div>
{% endblock %}
